# Production Docker Compose Configuration
# Optimized builds, security hardening, performance tuning

version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    image: cultural-diet-backend:latest
    container_name: cultural_diet_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=http://localhost:3001
      - DATABASE_PATH=/app/database/cultural_diet.db
      - JWT_SECRET=${JWT_SECRET:-your-production-jwt-secret}
      - LOG_LEVEL=info
      - MAX_MEMORY=512
    volumes:
      # Mount database directory for persistence
      - prod_database:/app/database
      # Mount logs for external log aggregation
      - prod_logs:/app/logs
      # Mount uploads directory
      - prod_uploads:/app/uploads
    networks:
      - cultural_diet_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - db_migrate

  # Frontend Service (Electron App)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    image: cultural-diet-frontend:latest
    container_name: cultural_diet_frontend
    environment:
      - NODE_ENV=production
      - ELECTRON_IS_DEV=0
      - DISPLAY=:99
    volumes:
      # Mount user data directory
      - prod_user_data:/app/data
      # Mount logs
      - prod_logs:/app/logs
    networks:
      - cultural_diet_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    depends_on:
      backend:
        condition: service_healthy

  # Database Migration Service
  db_migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    image: cultural-diet-backend:latest
    container_name: cultural_diet_db_migrate
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/database/cultural_diet.db
    volumes:
      - prod_database:/app/database
    networks:
      - cultural_diet_network
    command: >
      sh -c "
        echo '🚀 Running database migrations for production...' &&
        npm run migrate &&
        echo '✅ Database migrations completed successfully!'
      "
    restart: "no"

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: cultural_diet_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - prod_logs:/var/log/nginx
    networks:
      - cultural_diet_network
    restart: unless-stopped
    depends_on:
      - backend
    profiles:
      - reverse-proxy

  # Backup Service
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: cultural_diet_backup
    environment:
      - DATABASE_PATH=/app/database/cultural_diet.db
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}  # Daily at 2 AM
      - BACKUPRetention_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - S3_BUCKET=${S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - prod_database:/app/database:ro
      - prod_backups:/app/backups
      - prod_logs:/app/logs
    networks:
      - cultural_diet_network
    restart: unless-stopped
    profiles:
      - backup

  # Monitoring Service
  monitoring:
    image: prom/prometheus:latest
    container_name: cultural_diet_monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cultural_diet_network
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: cultural_diet_grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - cultural_diet_network
    restart: unless-stopped
    profiles:
      - monitoring
    depends_on:
      - monitoring

# Named Volumes
volumes:
  prod_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker-data/prod/database
  prod_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker-data/prod/logs
  prod_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker-data/prod/uploads
  prod_user_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker-data/prod/user_data
  prod_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker-data/prod/backups
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Networks
networks:
  cultural_diet_network:
    driver: bridge
    name: cultural_diet_prod_network
    ipam:
      config:
        - subnet: 172.20.0.0/16