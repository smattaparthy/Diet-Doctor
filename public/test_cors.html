<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>Testing Backend Connection</h1>
    <button onclick="testLogin()">Test Login</button>
    <pre id="result"></pre>

    <script>
        async function testLogin() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing...';

            try {
                const response = await fetch('http://localhost:3000/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'demo@culturaldiet.com',
                        password: 'DemoUser123@'
                    })
                });

                const data = await response.json();
                resultEl.textContent = `Success!\n\nStatus: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultEl.textContent = `Error: ${error.message}\n\nThis is likely a CORS issue.`;
                console.error('Full error:', error);
            }
        }
    </script>
</body>
</html>
