<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Meal Plan - Cultural Diet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Netflix Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #141414;
      color: #fff;
      min-height: 100vh;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 50%, transparent 100%);
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #e50914;
      text-decoration: none;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      color: #e5e5e5;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
      font-weight: 500;
    }

    nav a:hover, nav a.active {
      color: #fff;
    }

    .logout-btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: #c11119;
    }

    /* Main Content */
    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 60px;
    }

    .page-title {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #e50914 0%, #ff6b6b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-subtitle {
      font-size: 18px;
      color: #999;
      margin-bottom: 40px;
      font-weight: 400;
    }

    /* Form Card */
    .form-card {
      background: linear-gradient(135deg, rgba(40,40,40,0.95) 0%, rgba(30,30,30,0.95) 100%);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .form-section {
      margin-bottom: 35px;
    }

    .form-section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 18px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: #e50914;
      border-radius: 2px;
    }

    /* Form Elements */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #b3b3b3;
      letter-spacing: 0.5px;
    }

    input[type="date"],
    input[type="number"],
    select {
      background: rgba(51,51,51,0.8);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 12px 16px;
      color: #fff;
      font-size: 15px;
      transition: all 0.2s;
      font-family: inherit;
    }

    input[type="date"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: #e50914;
      background: rgba(51,51,51,1);
      box-shadow: 0 0 0 3px rgba(229,9,20,0.1);
    }

    /* Checkbox Group */
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: rgba(51,51,51,0.6);
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkbox-item:hover {
      background: rgba(51,51,51,0.8);
      border-color: rgba(229,9,20,0.3);
    }

    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #e50914;
    }

    .checkbox-item label {
      cursor: pointer;
      margin: 0;
      color: #e5e5e5;
      font-weight: 400;
    }

    /* Radio Group */
    .radio-group {
      display: flex;
      gap: 15px;
    }

    .radio-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: rgba(51,51,51,0.6);
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.2s;
    }

    .radio-item:hover {
      background: rgba(51,51,51,0.8);
      border-color: rgba(229,9,20,0.3);
    }

    .radio-item input[type="radio"] {
      cursor: pointer;
      accent-color: #e50914;
    }

    .radio-item label {
      cursor: pointer;
      margin: 0;
      color: #e5e5e5;
      font-weight: 400;
    }

    /* Multi-select Retailers */
    .retailer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Action Buttons */
    .form-actions {
      display: flex;
      gap: 15px;
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .btn {
      padding: 14px 32px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: inherit;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: #e50914;
      color: white;
      flex: 1;
    }

    .btn-primary:hover:not(:disabled) {
      background: #c11119;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(229,9,20,0.4);
    }

    .btn-primary:disabled {
      background: #666;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .btn-secondary {
      background: rgba(109,109,110,0.7);
      color: white;
      padding: 14px 24px;
    }

    .btn-secondary:hover {
      background: rgba(109,109,110,0.9);
    }

    /* Loading State */
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 3px solid rgba(229,9,20,0.3);
      border-radius: 50%;
      border-top: 3px solid #e50914;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Error/Success Messages */
    .message {
      padding: 15px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
      font-weight: 500;
    }

    .message.active {
      display: block;
    }

    .message.error {
      background: rgba(229,9,20,0.2);
      border: 1px solid rgba(229,9,20,0.4);
      color: #ff6b6b;
    }

    .message.success {
      background: rgba(46,125,50,0.2);
      border: 1px solid rgba(46,125,50,0.4);
      color: #66bb6a;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 15px 30px;
      }

      .container {
        padding: 0 30px;
        margin: 40px auto;
      }

      .page-title {
        font-size: 32px;
      }

      .form-card {
        padding: 25px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .checkbox-group {
        grid-template-columns: 1fr;
      }

      .retailer-grid {
        grid-template-columns: 1fr;
      }

      .radio-group {
        flex-direction: column;
      }

      .form-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="dashboard.html" class="logo">CULTURAL DIET</a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="meal-plan.html" class="active">Meal Plan</a>
      <a href="recipes.html">Recipes</a>
      <a href="shopping-list.html">Shopping List</a>
      <a href="settings.html">Settings</a>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>
  </header>

  <div class="container">
    <h1 class="page-title">Generate Meal Plan</h1>
    <p class="page-subtitle">Create a personalized weekly meal plan based on your preferences</p>

    <div id="messageArea"></div>

    <div class="form-card">
      <form id="mealPlanForm">
        <!-- Date Range Section -->
        <div class="form-section">
          <h2 class="section-title">Date Range</h2>
          <div class="form-row">
            <div class="form-group">
              <label for="startDate">Start Date</label>
              <input type="date" id="startDate" name="startDate" required>
            </div>
            <div class="form-group">
              <label for="daysCount">Number of Days</label>
              <input type="number" id="daysCount" name="daysCount" min="1" max="14" value="7" required>
            </div>
          </div>
        </div>

        <!-- Meals Per Day Section -->
        <div class="form-section">
          <h2 class="section-title">Meals Per Day</h2>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="breakfast" name="breakfast">
              <label for="breakfast">Breakfast</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="lunch" name="lunch" checked>
              <label for="lunch">Lunch</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="dinner" name="dinner" checked>
              <label for="dinner">Dinner</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="snack" name="snack">
              <label for="snack">Snack</label>
            </div>
          </div>
        </div>

        <!-- Servings Section -->
        <div class="form-section">
          <h2 class="section-title">Servings</h2>
          <div class="form-group">
            <label for="servings">Number of Servings per Meal</label>
            <input type="number" id="servings" name="servings" min="1" max="12" value="4" required>
          </div>
        </div>

        <!-- Preferences Section -->
        <div class="form-section">
          <h2 class="section-title">Preferences (Optional)</h2>

          <div class="form-group" style="margin-bottom: 20px;">
            <label for="maxPrepTime">Maximum Prep Time (minutes)</label>
            <input type="number" id="maxPrepTime" name="maxPrepTime" min="15" max="180" step="5" placeholder="e.g., 60">
          </div>

          <div class="form-group" style="margin-bottom: 20px;">
            <label for="varietyLevel">Variety Level</label>
            <div class="radio-group">
              <div class="radio-item">
                <input type="radio" id="varietyLow" name="varietyLevel" value="low">
                <label for="varietyLow">Low</label>
              </div>
              <div class="radio-item">
                <input type="radio" id="varietyMedium" name="varietyLevel" value="medium" checked>
                <label for="varietyMedium">Medium</label>
              </div>
              <div class="radio-item">
                <input type="radio" id="varietyHigh" name="varietyLevel" value="high">
                <label for="varietyHigh">High</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Preferred Retailers</label>
            <div class="retailer-grid">
              <div class="checkbox-item">
                <input type="checkbox" id="patelBrothers" name="retailers" value="Patel Brothers">
                <label for="patelBrothers">Patel Brothers</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="traderJoes" name="retailers" value="Trader Joes">
                <label for="traderJoes">Trader Joe's</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="costco" name="retailers" value="Costco">
                <label for="costco">Costco</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="walmart" name="retailers" value="Walmart">
                <label for="walmart">Walmart</label>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="window.location.href='dashboard.html'">Cancel</button>
          <button type="submit" class="btn btn-primary" id="generateBtn">Generate Meal Plan</button>
        </div>
      </form>

      <!-- Loading State -->
      <div class="loading" id="loadingArea">
        <div class="spinner"></div>
        <p style="color: #999; font-size: 14px;">Generating your personalized meal plan...</p>
      </div>
    </div>
  </div>

  <script>
    // Set minimum date to today
    document.getElementById('startDate').min = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = new Date().toISOString().split('T')[0];

    // Form submission handler
    document.getElementById('mealPlanForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Validate at least one meal selected
      const mealsSelected = ['breakfast', 'lunch', 'dinner', 'snack'].some(
        meal => document.getElementById(meal).checked
      );

      if (!mealsSelected) {
        showMessage('Please select at least one meal type', 'error');
        return;
      }

      // Gather form data
      const user = JSON.parse(localStorage.getItem('user'));
      const formData = {
        userId: user.id,
        startDate: document.getElementById('startDate').value,
        daysCount: parseInt(document.getElementById('daysCount').value),
        mealsPerDay: {
          breakfast: document.getElementById('breakfast').checked,
          lunch: document.getElementById('lunch').checked,
          dinner: document.getElementById('dinner').checked,
          snack: document.getElementById('snack').checked
        },
        servings: parseInt(document.getElementById('servings').value),
        preferences: {
          maxPrepTime: document.getElementById('maxPrepTime').value ?
            parseInt(document.getElementById('maxPrepTime').value) : undefined,
          varietyLevel: document.querySelector('input[name="varietyLevel"]:checked').value,
          retailerPrefs: Array.from(document.querySelectorAll('input[name="retailers"]:checked'))
            .map(cb => cb.value)
        }
      };

      // Show loading state
      document.getElementById('mealPlanForm').style.display = 'none';
      document.getElementById('loadingArea').classList.add('active');
      document.getElementById('generateBtn').disabled = true;

      try {
        const token = localStorage.getItem('token');
        const response = await fetch('http://localhost:3000/api/v1/meal-plans/weekly/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showMessage('Meal plan generated successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = `meal-plan-view.html?id=${data.data.mealPlan.id}`;
          }, 1500);
        } else {
          throw new Error(data.error || 'Failed to generate meal plan');
        }
      } catch (error) {
        console.error('Error generating meal plan:', error);
        showMessage(error.message || 'Failed to generate meal plan. Please try again.', 'error');

        // Reset UI
        document.getElementById('mealPlanForm').style.display = 'block';
        document.getElementById('loadingArea').classList.remove('active');
        document.getElementById('generateBtn').disabled = false;
      }
    });

    function showMessage(text, type) {
      const messageArea = document.getElementById('messageArea');
      messageArea.innerHTML = `<div class="message ${type} active">${text}</div>`;

      if (type === 'success') {
        setTimeout(() => {
          messageArea.innerHTML = '';
        }, 3000);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userId');
      window.location.href = 'login.html';
    }

    // Check authentication
    if (!localStorage.getItem('token')) {
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
