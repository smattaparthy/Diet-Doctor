<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List - Cultural Diet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #141414;
            color: #fff;
            min-height: 100vh;
        }

        /* Background gradient */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(229, 9, 20, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(70, 211, 105, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, rgba(20, 20, 20, 0.98) 0%, rgba(20, 20, 20, 1) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #E50914;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
            flex: 1;
            justify-content: center;
        }

        nav a {
            color: #e5e5e5;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
            font-weight: 500;
        }

        nav a:hover, nav a.active {
            color: #fff;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name {
            font-size: 14px;
            color: #b3b3b3;
        }

        .btn-logout {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: rgba(229, 9, 20, 0.2);
            border-color: #E50914;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            padding: 40px;
            margin: 0 auto;
            position: relative;
        }

        /* Header Section */
        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #b3b3b3;
            font-size: 1.1rem;
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 12px 24px;
            background: linear-gradient(135deg, #E50914 0%, #B20710 100%);
            border: none;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
        }

        .btn-secondary {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Lists Grid */
        .lists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .list-card {
            background: #1f1f1f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .list-card:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            background: #2a2a2a;
            border-color: rgba(229, 9, 20, 0.5);
        }

        .list-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .list-card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .list-card-date {
            font-size: 12px;
            color: #b3b3b3;
        }

        .list-card-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 18px;
        }

        .icon-btn:hover {
            color: #E50914;
            background: rgba(229, 9, 20, 0.1);
        }

        .list-card-stats {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat {
            font-size: 14px;
            color: #b3b3b3;
        }

        .stat strong {
            color: #E50914;
            font-weight: 600;
        }

        /* Detail View */
        .detail-view {
            display: none;
            background: #1f1f1f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 32px;
        }

        .detail-view.active {
            display: block;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-header h2 {
            font-size: 2rem;
            font-weight: 700;
        }

        .detail-actions {
            display: flex;
            gap: 12px;
        }

        /* Retailer Groups */
        .retailer-section {
            margin-bottom: 32px;
        }

        .retailer-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(229, 9, 20, 0.1);
            border-radius: 8px;
            border-left: 4px solid #E50914;
        }

        .retailer-icon {
            font-size: 24px;
        }

        .retailer-name {
            font-size: 18px;
            font-weight: 600;
        }

        .retailer-count {
            margin-left: auto;
            color: #b3b3b3;
            font-size: 14px;
        }

        /* Shopping Items */
        .shopping-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .shopping-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .shopping-item.checked {
            opacity: 0.6;
        }

        .shopping-item.checked .item-name {
            text-decoration: line-through;
        }

        .item-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #E50914;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .item-meta {
            font-size: 14px;
            color: #b3b3b3;
        }

        .item-quantity {
            font-size: 14px;
            color: #E50914;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }

        .item-remove {
            background: transparent;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .item-remove:hover {
            color: #E50914;
            background: rgba(229, 9, 20, 0.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1f1f1f;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 24px;
            padding: 4px;
        }

        .modal-close:hover {
            color: #E50914;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #E50914;
            background: rgba(255, 255, 255, 0.08);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #b3b3b3;
            margin-bottom: 24px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #b3b3b3;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: #1f1f1f;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            transform: translateY(120%);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateY(0);
        }

        .toast.success {
            border-left: 4px solid #46D369;
        }

        .toast.error {
            border-left: 4px solid #E50914;
        }

        .toast-icon {
            font-size: 20px;
        }

        .toast-message {
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
            }

            .container {
                padding: 20px;
            }

            .lists-grid {
                grid-template-columns: 1fr;
            }

            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .detail-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .detail-actions {
                width: 100%;
            }

            .modal-content {
                padding: 24px;
            }
        }

        @media print {
            body::before,
            .header,
            .action-bar,
            .detail-actions,
            .item-checkbox,
            .item-remove,
            .icon-btn {
                display: none !important;
            }

            body {
                background: white;
                color: black;
            }

            .detail-view,
            .retailer-section,
            .shopping-item {
                background: white !important;
                border-color: #ccc !important;
            }

            .detail-header h2 {
                color: black;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="dashboard.html" class="logo">🌿 Cultural Diet</a>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="meal-plan.html">Meal Plan</a>
            <a href="recipes.html">Recipes</a>
            <a href="shopping-list.html" class="active">Shopping List</a>
            <a href="settings.html">Settings</a>
        </nav>
        <div class="user-section">
            <span class="user-name" id="userName">Loading...</span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>Shopping Lists</h1>
            <p>Organize your grocery shopping by retailer</p>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <button class="btn-primary" onclick="openCreateListModal()">
                ➕ Create New List
            </button>
            <button class="btn-secondary" onclick="generateFromMealPlan()">
                🍽️ Generate from Meal Plan
            </button>
        </div>

        <!-- Lists Overview -->
        <div id="listsOverview">
            <div class="lists-grid" id="listsGrid">
                <div class="loading">Loading shopping lists...</div>
            </div>
        </div>

        <!-- Detail View -->
        <div id="detailView" class="detail-view">
            <div class="detail-header">
                <div>
                    <h2 id="detailTitle">Shopping List</h2>
                    <p id="detailDate" style="color: #b3b3b3; margin-top: 4px;"></p>
                </div>
                <div class="detail-actions">
                    <button class="btn-secondary" onclick="printList()">🖨️ Print</button>
                    <button class="btn-secondary" onclick="addItemToList()">➕ Add Item</button>
                    <button class="btn-secondary" onclick="backToOverview()">← Back</button>
                </div>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- Create List Modal -->
    <div id="createListModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Shopping List</h3>
                <button class="modal-close" onclick="closeCreateListModal()">×</button>
            </div>
            <form id="createListForm" onsubmit="createList(event)">
                <div class="form-group">
                    <label for="listName">List Name *</label>
                    <input type="text" id="listName" required placeholder="e.g., Weekly Groceries">
                </div>
                <div class="form-group">
                    <label for="listNotes">Notes (optional)</label>
                    <textarea id="listNotes" rows="3" placeholder="Any special notes..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeCreateListModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Create List</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div id="addItemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Item</h3>
                <button class="modal-close" onclick="closeAddItemModal()">×</button>
            </div>
            <form id="addItemForm" onsubmit="submitAddItem(event)">
                <div class="form-group">
                    <label for="itemName">Item Name *</label>
                    <input type="text" id="itemName" required placeholder="e.g., Organic Tomatoes">
                </div>
                <div class="form-group">
                    <label for="itemQuantity">Quantity *</label>
                    <input type="text" id="itemQuantity" required placeholder="e.g., 2 lbs, 1 dozen">
                </div>
                <div class="form-group">
                    <label for="itemRetailer">Retailer *</label>
                    <select id="itemRetailer" required>
                        <option value="">Select retailer...</option>
                        <option value="Patel Brothers">Patel Brothers</option>
                        <option value="Trader Joe's">Trader Joe's</option>
                        <option value="Costco">Costco</option>
                        <option value="Walmart">Walmart</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="itemCategory">Category (optional)</label>
                    <input type="text" id="itemCategory" placeholder="e.g., Produce, Dairy">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeAddItemModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Add Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast" class="toast">
        <span class="toast-icon" id="toastIcon"></span>
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/v1';
        let shoppingLists = [];
        let currentListId = null;
        let currentList = null;

        // Authentication
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }
            return true;
        }

        function getAuthHeaders() {
            return {
                'Authorization': `Bearer ${localStorage.getItem('token')}`,
                'Content-Type': 'application/json'
            };
        }

        function loadUserData() {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('userName').textContent = user.name;
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        // Toast Notifications
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const messageEl = document.getElementById('toastMessage');

            toast.className = `toast ${type}`;
            icon.textContent = type === 'success' ? '✓' : '✕';
            messageEl.textContent = message;

            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Load Shopping Lists
        async function loadShoppingLists() {
            try {
                const response = await fetch(`${API_URL}/shopping-lists`, {
                    headers: getAuthHeaders()
                });

                if (!response.ok) {
                    throw new Error('Failed to load shopping lists');
                }

                const result = await response.json();
                shoppingLists = result.data || [];
                renderListsGrid();
            } catch (error) {
                console.error('Error loading shopping lists:', error);
                showToast('Failed to load shopping lists', 'error');
                renderEmptyState();
            }
        }

        // Render Lists Grid
        function renderListsGrid() {
            const grid = document.getElementById('listsGrid');

            if (shoppingLists.length === 0) {
                renderEmptyState();
                return;
            }

            grid.innerHTML = shoppingLists.map(list => {
                const totalItems = list.items ? list.items.length : 0;
                const checkedItems = list.items ? list.items.filter(item => item.checked).length : 0;
                const createdDate = new Date(list.created_at).toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });

                return `
                    <div class="list-card" onclick="viewListDetail(${list.id})">
                        <div class="list-card-header">
                            <div>
                                <div class="list-card-title">${escapeHtml(list.name)}</div>
                                <div class="list-card-date">${createdDate}</div>
                            </div>
                            <div class="list-card-actions" onclick="event.stopPropagation()">
                                <button class="icon-btn" onclick="deleteList(${list.id})" title="Delete">🗑️</button>
                            </div>
                        </div>
                        ${list.notes ? `<p style="color: #b3b3b3; font-size: 14px; margin-top: 8px;">${escapeHtml(list.notes)}</p>` : ''}
                        <div class="list-card-stats">
                            <div class="stat"><strong>${totalItems}</strong> items</div>
                            <div class="stat"><strong>${checkedItems}/${totalItems}</strong> checked</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Empty State
        function renderEmptyState() {
            const grid = document.getElementById('listsGrid');
            grid.innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <div class="empty-state-icon">🛒</div>
                    <h3>No Shopping Lists Yet</h3>
                    <p>Create your first shopping list to get started</p>
                    <button class="btn-primary" onclick="openCreateListModal()">
                        ➕ Create Shopping List
                    </button>
                </div>
            `;
        }

        // View List Detail
        async function viewListDetail(listId) {
            try {
                const response = await fetch(`${API_URL}/shopping-lists/${listId}`, {
                    headers: getAuthHeaders()
                });

                if (!response.ok) {
                    throw new Error('Failed to load list details');
                }

                const result = await response.json();
                currentList = result.data;
                currentListId = listId;

                renderDetailView();

                // Hide overview, show detail
                document.getElementById('listsOverview').style.display = 'none';
                document.getElementById('detailView').classList.add('active');
            } catch (error) {
                console.error('Error loading list details:', error);
                showToast('Failed to load list details', 'error');
            }
        }

        // Render Detail View
        function renderDetailView() {
            if (!currentList) return;

            document.getElementById('detailTitle').textContent = currentList.name;
            const createdDate = new Date(currentList.created_at).toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('detailDate').textContent = `Created ${createdDate}`;

            const items = currentList.items || [];
            const groupedByRetailer = groupByRetailer(items);

            const content = document.getElementById('detailContent');

            if (items.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <h3>No Items Yet</h3>
                        <p>Add items to your shopping list</p>
                        <button class="btn-primary" onclick="addItemToList()">
                            ➕ Add First Item
                        </button>
                    </div>
                `;
                return;
            }

            content.innerHTML = Object.keys(groupedByRetailer).map(retailer => {
                const retailerItems = groupedByRetailer[retailer];
                const retailerIcons = {
                    'Patel Brothers': '🏪',
                    'Trader Joe\'s': '🛒',
                    'Costco': '🏬',
                    'Walmart': '🏪',
                    'Other': '🏪'
                };

                return `
                    <div class="retailer-section">
                        <div class="retailer-header">
                            <div class="retailer-icon">${retailerIcons[retailer] || '🏪'}</div>
                            <div class="retailer-name">${retailer}</div>
                            <div class="retailer-count">${retailerItems.length} items</div>
                        </div>
                        <div class="shopping-items">
                            ${retailerItems.map(item => `
                                <div class="shopping-item ${item.checked ? 'checked' : ''}" data-item-id="${item.id}">
                                    <input
                                        type="checkbox"
                                        class="item-checkbox"
                                        ${item.checked ? 'checked' : ''}
                                        onchange="toggleItemCheck(${item.id}, this.checked)"
                                    >
                                    <div class="item-details">
                                        <div class="item-name">${escapeHtml(item.product_name || item.name || 'Item')}</div>
                                        ${item.category ? `<div class="item-meta">${escapeHtml(item.category)}</div>` : ''}
                                    </div>
                                    <div class="item-quantity">${escapeHtml(item.quantity || '1')}</div>
                                    <button class="item-remove" onclick="removeItem(${item.id})" title="Remove">×</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Group items by retailer
        function groupByRetailer(items) {
            return items.reduce((acc, item) => {
                const retailer = item.retailer || 'Other';
                if (!acc[retailer]) acc[retailer] = [];
                acc[retailer].push(item);
                return acc;
            }, {});
        }

        // Toggle Item Check
        async function toggleItemCheck(itemId, checked) {
            try {
                const response = await fetch(`${API_URL}/shopping-lists/${currentListId}/items/${itemId}`, {
                    method: 'PATCH',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ checked })
                });

                if (!response.ok) {
                    throw new Error('Failed to update item');
                }

                // Update local state
                const item = currentList.items.find(i => i.id === itemId);
                if (item) {
                    item.checked = checked;
                }

                showToast(checked ? 'Item checked' : 'Item unchecked', 'success');
            } catch (error) {
                console.error('Error updating item:', error);
                showToast('Failed to update item', 'error');
                // Reload to sync state
                viewListDetail(currentListId);
            }
        }

        // Remove Item
        async function removeItem(itemId) {
            if (!confirm('Remove this item from the list?')) return;

            try {
                const response = await fetch(`${API_URL}/shopping-lists/${currentListId}/items/${itemId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (!response.ok) {
                    throw new Error('Failed to remove item');
                }

                showToast('Item removed', 'success');
                // Reload list
                viewListDetail(currentListId);
            } catch (error) {
                console.error('Error removing item:', error);
                showToast('Failed to remove item', 'error');
            }
        }

        // Back to Overview
        function backToOverview() {
            document.getElementById('detailView').classList.remove('active');
            document.getElementById('listsOverview').style.display = 'block';
            currentListId = null;
            currentList = null;
            loadShoppingLists();
        }

        // Create List Modal
        function openCreateListModal() {
            document.getElementById('createListModal').classList.add('active');
            document.getElementById('createListForm').reset();
        }

        function closeCreateListModal() {
            document.getElementById('createListModal').classList.remove('active');
        }

        async function createList(event) {
            event.preventDefault();

            const name = document.getElementById('listName').value.trim();
            const notes = document.getElementById('listNotes').value.trim();

            try {
                const response = await fetch(`${API_URL}/shopping-lists`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ name, notes })
                });

                if (!response.ok) {
                    throw new Error('Failed to create list');
                }

                const result = await response.json();
                showToast('Shopping list created!', 'success');
                closeCreateListModal();
                loadShoppingLists();
            } catch (error) {
                console.error('Error creating list:', error);
                showToast('Failed to create list', 'error');
            }
        }

        // Delete List
        async function deleteList(listId) {
            if (!confirm('Delete this shopping list? This cannot be undone.')) return;

            try {
                const response = await fetch(`${API_URL}/shopping-lists/${listId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (!response.ok) {
                    throw new Error('Failed to delete list');
                }

                showToast('Shopping list deleted', 'success');
                loadShoppingLists();
            } catch (error) {
                console.error('Error deleting list:', error);
                showToast('Failed to delete list', 'error');
            }
        }

        // Add Item Modal
        function addItemToList() {
            if (!currentListId) return;
            document.getElementById('addItemModal').classList.add('active');
            document.getElementById('addItemForm').reset();
        }

        function closeAddItemModal() {
            document.getElementById('addItemModal').classList.remove('active');
        }

        async function submitAddItem(event) {
            event.preventDefault();

            const name = document.getElementById('itemName').value.trim();
            const quantity = document.getElementById('itemQuantity').value.trim();
            const retailer = document.getElementById('itemRetailer').value;
            const category = document.getElementById('itemCategory').value.trim();

            try {
                const response = await fetch(`${API_URL}/shopping-lists/${currentListId}/items`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        product_name: name,
                        quantity,
                        retailer,
                        category: category || undefined,
                        product_sku: 'manual-' + Date.now() // Generate temporary SKU for manual items
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to add item');
                }

                showToast('Item added!', 'success');
                closeAddItemModal();
                // Reload list
                viewListDetail(currentListId);
            } catch (error) {
                console.error('Error adding item:', error);
                showToast('Failed to add item', 'error');
            }
        }

        // Generate from Meal Plan
        async function generateFromMealPlan() {
            try {
                const response = await fetch(`${API_URL}/shopping-lists/from-meal-plan`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        start_date: new Date().toISOString().split('T')[0],
                        days: 7
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to generate from meal plan');
                }

                const result = await response.json();
                showToast('Shopping list generated from meal plan!', 'success');
                loadShoppingLists();
            } catch (error) {
                console.error('Error generating from meal plan:', error);
                showToast('Failed to generate from meal plan. Make sure you have a meal plan created.', 'error');
            }
        }

        // Print List
        function printList() {
            window.print();
        }

        // Utility Functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        if (checkAuth()) {
            loadUserData();
            loadShoppingLists();
        }
    </script>
</body>
</html>
