# Prometheus Configuration for Cultural Diet App

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    service: 'cultural-diet'

rule_files:
  # - "rules/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Cultural Diet Backend
  - job_name: 'cultural-diet-backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Docker Container Metrics (if cadvisor is available)
  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: '/metrics'
    scrape_interval: 30s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Recording rules
recording_rules:
  - name: cultural_diet_rules
    rules:
      # API request rate
      - record: job:cultural_diet_api_requests:rate5m
        expr: rate(http_requests_total{job="cultural-diet-backend"}[5m])

      # API error rate
      - record: job:cultural_diet_api_errors:rate5m
        expr: rate(http_requests_total{job="cultural-diet-backend",status=~"5.."}[5m])

      # Database connections
      - record: job:cultural_diet_db_connections
        expr: sqlite_db_connections{job="cultural-diet-backend"}

# Alerting rules
alerting_rules:
  - name: cultural_diet_alerts
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: job:cultural_diet_api_errors:rate5m > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      # Service down alert
      - alert: ServiceDown
        expr: up{job="cultural-diet-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cultural Diet service is down"
          description: "The cultural diet backend service has been down for more than 1 minute"

      # High memory usage alert
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Container memory usage is above 90%"