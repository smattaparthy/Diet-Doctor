# Fluent Bit Configuration for Cultural Diet App Log Aggregation

[SERVICE]
    # Flush
    Flush        5
    # Daemon
    Daemon       Off
    # Log_Level
    Log_Level    info
    # Parsers_File
    Parsers_File parsers.conf
    # HTTP_Server
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# Input: Application Logs
[INPUT]
    Name             tail
    Path             /var/log/app/*.log
    Parser           json
    Tag              app.*
    Refresh_Interval 5
    Mem_Buf_Limit    50MB
    Skip_Long_Lines  On

# Input: System Logs
[INPUT]
    Name             tail
    Path             /var/log/syslog
    Parser           syslog
    Tag              system.*
    Refresh_Interval 5
    Mem_Buf_Limit    50MB

# Input: Docker Container Logs
[INPUT]
    Name             systemd
    Tag              systemd.*
    Systemd_Filter   _SYSTEMD_UNIT=docker.service
    Systemd_Filter   _SYSTEMD_UNIT=cultural-diet*.service

# Input: Database Logs
[INPUT]
    Name             tail
    Path             /var/log/sqlite/*.log
    Parser           sqlite
    Tag              database.*
    Refresh_Interval 5
    Mem_Buf_Limit    50MB

# Filter: Add environment metadata
[FILTER]
    Name             modify
    Match            *
    Add              environment production
    Add              service cultural-diet
    Add              hostname ${HOSTNAME}

# Filter: Parse JSON logs if needed
[FILTER]
    Name             parser
    Match            app.*_json
    Key_Name         log
    Parser           json
    Reserve_Data     On

# Filter: Add timestamp
[FILTER]
    Name             modify
    Match            *
    Add              processed_at ${HOSTNAME}_${TIME}

# Output: Standard Output (for debugging)
[OUTPUT]
    Name  stdout
    Match *
    Format json_lines

# Output: Elasticsearch (for log storage)
[OUTPUT]
    Name            es
    Match           *
    Host            elasticsearch
    Port            9200
    Index           cultural-diet-logs
    Type            _doc
    Time_Key        @timestamp
    Include_Tag_Key On
    Tag_Key         fluent_tag

# Output: InfluxDB (for metrics from logs)
[OUTPUT]
    Name            influxdb
    Match           app.*_metrics
    Host            influxdb
    Port            8086
    Database        cultural_diet_metrics
    Tag_Key         fluent_tag

# Output: File (backup logs)
[OUTPUT]
    Name            file
    Match           *
    Path            /var/log/fluent-bit/backup
    File            backup.log
    Format          json_lines

# Output: Loki (Grafana Loki)
[OUTPUT]
    Name loki
    Match *
    Host loki
    Port 3100
    Labels env=production,service=cultural-diet
    Remove_keys fluent_tag,processed_at